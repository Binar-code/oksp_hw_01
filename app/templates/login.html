{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-md-6 col-lg-4">
<section class="card card-body p-4">
    <h2 class="h4 mb-3 text-break">Вход</h2>
    <p class="text-secondary small">Войдите, чтобы создавать заявки и отвечать на них.</p>
    {% if error %}<p class="text-danger" role="alert">{{ error }}</p>{% endif %}
    <form action="/login" method="post" data-native="true">
        <label class="form-label d-block mb-3">Логин<input class="form-control mt-1" name="username" required autocomplete="username"></label>
        <label class="form-label d-block mb-3">Пароль<input class="form-control mt-1" name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary w-100">Войти</button>
    </form>
</section>
</div></div>
{% endblock %}
